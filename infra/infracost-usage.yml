# Usage assumptions for the Infracost estimate. CloudFront is pay-as-you-go (ADR 0019), but
# Infracost ignores the always-free tier: treat the CloudFront value as a ceiling.
# Update these assumptions when the usage pattern changes (see infra/CLAUDE.md).
version: 0.1
resource_type_default_usage:
  aws_cloudfront_distribution:
    monthly_data_transfer_to_internet_gb:
      south_america: 100
    monthly_https_requests:
      south_america: 1000000
  aws_wafv2_web_acl:
    monthly_requests: 1000000
  aws_route53_record:
    monthly_standard_queries: 1000000
  aws_s3_bucket:
    standard:
      storage_gb: 1
      monthly_tier_1_requests: 10000
      monthly_tier_2_requests: 100000
  # API (Phase 1B): a few hundred learners syncing progress.
  aws_lambda_function:
    monthly_requests: 300000
    request_duration_ms: 100
  aws_apigatewayv2_api:
    monthly_requests: 300000
  aws_dynamodb_table:
    storage_gb: 1
    pitr_backup_storage_gb: 1
    monthly_write_request_units: 200000
    monthly_read_request_units: 600000
  aws_cloudwatch_log_group:
    storage_gb: 1
    monthly_data_ingested_gb: 1
    monthly_data_scanned_gb: 1
