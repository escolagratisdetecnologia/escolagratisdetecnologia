name: infra

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'tools/check-tags/**'
      - 'infracost.yml'
      - '.github/workflows/infra.yml'

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: 'true'

jobs:
  static:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: terraform validate (todas as raízes)
        run: |
          # modules/edge uses a provider alias: it is validated via live and tested with mocks below.
          for root in modules/tags modules/site modules/observability modules/state-bucket bootstrap/account bootstrap/management live; do
            terraform -chdir=infra/$root init -backend=false -input=false >/dev/null
            terraform -chdir=infra/$root validate
          done
      - name: terraform test
        run: |
          for root in modules/tags modules/edge modules/observability bootstrap/management bootstrap/account; do
            terraform -chdir=infra/$root init -backend=false -input=false >/dev/null
            terraform -chdir=infra/$root test
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6
        with:
          tflint_version: v0.64.0
      - name: tflint
        working-directory: infra
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: '1'

  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: static
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::${{ matrix.env == 'prod' && vars.AWS_ACCOUNT_ID_PROD || vars.AWS_ACCOUNT_ID_DEV }}:role/egt-${{ matrix.env }}-bootstrap-github-plan
          aws-region: sa-east-1
      - name: terraform plan
        run: infra/tf live ${{ matrix.env }} plan -input=false -lock-timeout=5m -out=tfplan
        env:
          TF_VAR_alert_emails: ${{ secrets.ALERT_EMAILS || '[]' }}
      # plan.json holds sensitive values (such as alert_emails) in plain text: never upload it as an artifact.
      - run: terraform -chdir=infra/live show -json tfplan > plan.json
      - name: check-tags
        run: node tools/check-tags/src/cli.ts plan.json
      - name: resumo do plano
        run: |
          {
            echo "### Plano Terraform: ${{ matrix.env }}"
            echo '```'
            terraform -chdir=infra/live show -no-color tfplan | tail -n 200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  infracost:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: head
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base
      - uses: infracost/actions/diff@fb736a8f219195d6efdca58682069b16fe1bc280 # v4
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          base-path: base
          head-path: head
