name: deploy-env

on:
  workflow_call:
    inputs:
      environment:
        description: Ambiente de destino (dev ou prod)
        required: true
        type: string
      site_url:
        description: URL pública do ambiente
        required: true
        type: string
      redirect_hosts:
        description: Nomes que devem redirecionar para a URL do ambiente, separados por espaço
        required: false
        type: string
        default: ''
    secrets:
      ALERT_EMAILS:
        description: Lista JSON de e-mails de alerta de orçamento
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    environment: ${{ inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      SITE_URL: ${{ inputs.site_url }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Terraform zips apps/api/dist into the Lambda package.
      - run: pnpm --filter @egt/api build
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/egt-${{ inputs.environment }}-bootstrap-github-apply
          aws-region: sa-east-1
      - name: terraform apply
        run: infra/tf live "$ENVIRONMENT" apply -input=false -auto-approve -lock-timeout=5m
        env:
          TF_VAR_alert_emails: ${{ secrets.ALERT_EMAILS || '[]' }}
          TF_VAR_app_version: ${{ github.sha }}
      - run: tools/deploy-site.sh "$ENVIRONMENT"
      - run: tools/smoke.sh "$SITE_URL" "$GITHUB_SHA"
      - name: API recusa acesso direto (sem CloudFront)
        run: |
          endpoint="$(terraform -chdir=infra/live output -raw api_gateway_endpoint)"
          status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 --retry 3 --retry-all-errors "$endpoint/api/health")"
          if [ "$status" != "403" ]; then
            echo "Acesso direto à API deveria dar 403, deu $status."
            exit 1
          fi
      - name: outros nomes redirecionam para o domínio
        if: inputs.redirect_hosts != ''
        env:
          REDIRECT_HOSTS: ${{ inputs.redirect_hosts }}
        run: |
          for host in $REDIRECT_HOSTS; do
            result="$(curl -s --max-time 10 --retry 3 --retry-all-errors -o /dev/null -w '%{http_code} %{redirect_url}' "https://$host/")"
            if [ "$result" != "301 $SITE_URL/" ]; then
              echo "Redirect de $host inesperado: '$result' (esperado '301 $SITE_URL/')."
              exit 1
            fi
          done
