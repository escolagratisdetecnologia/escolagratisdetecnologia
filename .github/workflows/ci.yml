name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm content:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          SITE_ENV: prod
          SITE_DRAFTS: 'true'
          SITE_URL: https://escolagratisdetecnologia.com.br
      - run: pnpm --filter @egt/web check:csp
      - run: pnpm --filter @egt/web exec playwright install --with-deps chromium webkit
      - run: pnpm --filter @egt/web test:e2e
      - run: pnpm --filter @egt/web lighthouse
      - name: Build de prod (sem rascunhos) e guardas
        run: |
          pnpm build
          pnpm --filter @egt/web check:csp
          pnpm --filter @egt/web check:drafts
        env:
          SITE_ENV: prod
          SITE_DRAFTS: 'false'
          SITE_URL: https://escolagratisdetecnologia.com.br
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: relatorios-web
          path: |
            apps/web/playwright-report
            apps/web/.lighthouseci
          if-no-files-found: ignore
